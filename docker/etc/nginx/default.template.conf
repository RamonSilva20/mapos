server {
    listen ${NGINX_PORT} default_server;
    listen [::]:${NGINX_PORT} default_server;
    server_name ${NGINX_HOST};

    root /var/www/html;
    index index.html index.php;
    client_max_body_size 64M;

    # A pasta application/ fica dentro da raiz do documento, e nada nela deve
    # ser servido. Sem esta regra, qualquer .php sob application/ seria executado
    # pelo php-fpm abaixo — inclusive application/tests/bin/setup-db.php, que
    # recria um banco, e application/database/seeds/, que trazem as credenciais
    # de fábrica.
    #
    # O ^~ é obrigatório: sem ele, a location ~* \.php$ é avaliada antes (as
    # regex têm prioridade sobre prefixo comum) e o acesso passaria.
    location ^~ /application/ {
        return 404;
    }

    # A pasta tools/ fica na raiz do documento pela mesma razão, e nada nela deve
    # ser servido também. O conteúdo é menos explosive que application/ — o gate em
    # si bloqueia a execução por SAPI — mas o que mora ali não é código: é
    # tools/xss-baseline.txt, o inventário de cada valor que chega à página sem
    # escaper, com arquivo, expressão e linha de cada um. Servir isso é publicar um
    # mapa do que não está escapado, que é a mesma informação que um XSS entrega
    # um exploit por vez.
    #
    # O ^~ é obrigatório pelo mesmo motivo da location acima: sem ele, a
    # ~* \.php$ é avaliada antes e o acesso passaria.
    #
    # O .htaccess daqui cobre o Apache. Ele não cobre o nginx, que não lê
    # .htaccess, e por isso a regra precisa existir nos dois lados — muda num e não
    # no outro e a pasta volta a ser servida sem nenhum aviso.
    location ^~ /tools/ {
        return 404;
    }

    # . files
    location ~ /\.(?!well-known) {
        deny all;
    }

    # upload folders: never execute scripts
    location ~* ^/assets/(anexos|arquivos)/.*\.(php[0-9]*|phtml|phar|pht|phps)$ {
        deny all;
    }

    # set expiration of assets to MAX for caching
    location ~* \.(ico|css|js|gif|jpe?g|png)(\?[0-9]+)?$ {
        expires max;
        log_not_found off;
    }

    # index.php
    index index.php;

    location / {
        # Check if a file or directory index file exists, else route it to index.php.
        try_files $uri $uri/ /index.php;
    }

    location ~* \.php$ {
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 600;
        include fastcgi_params;
    }
}
